<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Road Book</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4efe7;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .audio-card {
      width: min(100%, 520px);
      padding: 28px;
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }
    h1 { margin-top: 0; color: #17345f; }
    p { color: #444; line-height: 1.5; }
    audio { width: 100%; margin-top: 18px; }
    .volver-roadbook {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 24px;
      background: #17345f;
      color: white;
      border: none;
      text-decoration: none;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    .error { color: #8b1e1e; }
  </style>
</head>
<body>
  <main class="audio-card">
    <h1 id="titulo">Audio Road Book</h1>
    <p id="texto">Pulsa el reproductor para escuchar el audio del Road Book.</p>
    <audio id="reproductor" controls preload="metadata"></audio>
    <p id="error" class="error" hidden>No se ha indicado ningún audio.</p>
    <button class="volver-roadbook" type="button" onclick="window.history.back();">← Volver al Roadbook</button>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const archivo = params.get('audio');
    const nombre = params.get('nombre');
    const reproductor = document.getElementById('reproductor');
    const titulo = document.getElementById('titulo');
    const error = document.getElementById('error');

    if (archivo) {
      reproductor.src = archivo;
      titulo.textContent = nombre || archivo.replace(/\.mp3$/i, '').replace(/[-_]/g, ' ');
    } else {
      reproductor.hidden = true;
      error.hidden = false;
    }
  </script>
</body>
</html>
